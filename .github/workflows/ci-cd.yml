name: Kubernetes and authentication infrastructure

on:
  pull_request:
    branches: master
  push:
    branches: master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    needs: validate
    if: github.event_name == 'push'
    concurrency:
      group: mechanic-shop-kubernetes-infrastructure-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apply Terraform
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_app_deployer_role_arn: ${{ vars.APP_DEPLOYER_ROLE_ARN }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=kubernetes/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          echo "VPC_ID=$(terraform output -raw vpc_id)"
          echo "VPC_CIDR=$(terraform output -raw vpc_cidr)"
          echo "PRIVATE_SUBNET_IDS_JSON=$(terraform output -json private_subnet_ids)"

  validate-observability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy-observability:
    needs: [deploy, validate-observability]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.HEALTH_CHECK_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Apply New Relic Terraform
        env:
          TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_app_name: ${{ vars.NEW_RELIC_APP_NAME }}
          TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
          TF_VAR_health_check_url: ${{ vars.HEALTH_CHECK_URL }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=kubernetes/observability.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
