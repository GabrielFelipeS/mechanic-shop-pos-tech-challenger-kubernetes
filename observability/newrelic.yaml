# Source: nri-bundle/charts/k8s-agents-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nri-bundle-k8s-agents-operator
  namespace: newrelic
  labels:
    control-plane: controller-manager
    app.kubernetes.io/instance: nri-bundle
    app.kubernetes.io/name: k8s-agents-operator
    app.kubernetes.io/version: 0.49.0
    helm.sh/chart: k8s-agents-operator-0.49.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: nri-bundle
      app.kubernetes.io/name: k8s-agents-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/instance: nri-bundle
        app.kubernetes.io/name: k8s-agents-operator
      annotations:
        checksum/serving-ca: 337ae169a21d955bd4f35fbf7e5d4e3328b7ea9b2c022e8f5f08dd2848cd2d79
        
    spec:
      serviceAccountName: nri-bundle-k8s-agents-operator
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      containers:
      - name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --zap-log-level=info
        - --health-probe-bind-address=:8081
        - --webhook-service-bind-address=:9443
        command:
        - /bin/operator
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: "cluster.local"
        - name: ENABLE_WEBHOOKS
          value: "true"
        image: docker.io/newrelic/k8s-agents-operator:0.49.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 192Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: nri-bundle-k8s-agents-operator-controller-manager-service-cert
